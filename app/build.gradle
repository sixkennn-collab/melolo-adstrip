plugins {
    id 'com.android.application'
}

android {
    namespace 'fx.oll.melolo'
    compileSdk 34

    defaultConfig {
        applicationId 'fx.oll.melolo'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Nothing to strip: all hook targets are resolved by name at runtime.
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    packaging {
        resources {
            excludes += ['META-INF/*', 'META-INF/**']
        }
    }

    lint {
        abortOnError false
    }
}

dependencies {
    // Provided by LSPosed at runtime. Never ship this jar inside the APK.
    compileOnly 'de.robv.android.xposed:api:82'
}
